<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BarberNote</title>
<meta name="robots" content="noindex">
<script>
  (function () {
    var IOS = "https://apps.apple.com/app/id6789102901";
    var ANDROID = "https://play.google.com/store/apps/details?id=com.elolabs.barbernote";
    var ua = navigator.userAgent || "";
    var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (isIOS) { location.replace(IOS); }
    else if (/Android/i.test(ua)) { location.replace(ANDROID); }
  })();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #fff; color: #1a1a1a; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: #555; }
  a { display: block; margin: 10px auto; max-width: 260px; padding: 14px; border-radius: 10px;
    background: #1a1a1a; color: #fff; text-decoration: none; font-weight: 600; }
  a:focus-visible { outline: 3px solid #3b82f6; outline-offset: 2px; }
</style>
</head>
<body>
  <main>
    <h1>BarberNote</h1>
    <p>Barber appointments and cash register</p>
    <a href="https://apps.apple.com/app/id6789102901">App Store</a>
    <a href="https://play.google.com/store/apps/details?id=com.elolabs.barbernote">Google Play</a>
  </main>
</body>
</html>
